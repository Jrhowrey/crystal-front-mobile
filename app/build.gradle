plugins {
    id 'com.android.application'
}

android {
    namespace 'com.crystalfront.mobilecommand'
    compileSdk 34

    defaultConfig {
        applicationId "com.crystalfront.mobilecommand"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "5.0.0-3d-vtol"
    }

    sourceSets {
        main {
            shaders.srcDirs = []
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
